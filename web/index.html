<!DOCTYPE html>
<html lang="">
<head>
    <title>Go Chat Test</title>
</head>
<body>

<label for="name"></label><input id="name" type="text" placeholder="name">
<label for="message"></label><input id="message" type="text">
<button id="send">Send</button>

<script>
    const name = document.getElementById("name");
    const message = document.getElementById("message");

    let socket;

    name.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;

        const value = name.value.trim();
        if (!value) return;

        if (
            socket?.readyState === WebSocket.CONNECTING ||
            socket?.readyState === WebSocket.OPEN
        ) return;

        socket = new WebSocket(
            `ws://localhost:8080/ws?name=${encodeURIComponent(value)}`
        );

        socket.onmessage = (event) => {
            const message = JSON.parse(event.data);

            if (message.type === "system") {
                console.log(`[system] ${message.content}`);
                return;
            }

            console.log(`${message.name}: ${message.content}`);
        };

        name.disabled = true;
    });

    document.getElementById("send").onclick = () => {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        socket.send(message.value);
        message.value = "";
    };
</script>

</body>
</html>
